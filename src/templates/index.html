<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sefer</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="header">
        <h1>Sefer</h1>
        <div class="user-info">
            <span id="user-email"></span>
            <button class="logout-btn" onclick="logout()">Salir</button>
        </div>
    </div>

    <div class="chat-area" id="chat-area">
        <div class="message assistant">
            Hola! Soy Sefer, tu asistente para Odoo. Preguntame lo que necesites.
        </div>
    </div>

    <div class="typing-indicator" id="typing">
        <span class="typing-text">Pensando</span><span>.</span><span>.</span><span>.</span>
    </div>

    <div class="input-area">
        <div class="input-wrapper">
            <textarea
                id="msg-input"
                placeholder="Escribe tu pregunta..."
                rows="1"
                autofocus
            ></textarea>
            <button id="send-btn" onclick="sendMessage()">&#9654;</button>
        </div>
    </div>

    <script>
        const TOKEN = localStorage.getItem('sefer_token');
        const EMAIL = localStorage.getItem('sefer_email');

        if (!TOKEN) {
            window.location.href = '/login';
        }

        document.getElementById('user-email').textContent = EMAIL || '';

        const chatArea = document.getElementById('chat-area');
        const msgInput = document.getElementById('msg-input');
        const sendBtn = document.getElementById('send-btn');
        const typingEl = document.getElementById('typing');
        const typingText = document.querySelector('.typing-text');

        let currentSessionId = null;

        msgInput.addEventListener('input', () => {
            msgInput.style.height = 'auto';
            msgInput.style.height = Math.min(msgInput.scrollHeight, 200) + 'px';
        });

        msgInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function addMessage(text, role) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            if (role === 'assistant') {
                div.innerHTML = '';
            } else {
                div.textContent = text;
            }
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
            return div;
        }

        function setTyping(visible, text) {
            typingEl.classList.toggle('visible', visible);
            if (text) typingText.textContent = text;
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        async function sendMessage() {
            const text = msgInput.value.trim();
            if (!text) return;

            msgInput.value = '';
            msgInput.style.height = 'auto';
            sendBtn.disabled = true;

            addMessage(text, 'user');
            setTyping(true, 'Pensando');

            const assistantDiv = addMessage('', 'assistant');
            let textParts = [];
            let toolsUsed = [];

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${TOKEN}`,
                    },
                    body: JSON.stringify({
                        message: text,
                        session_id: currentSessionId,
                    }),
                });

                if (res.status === 401) {
                    localStorage.clear();
                    window.location.href = '/login';
                    return;
                }

                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop();

                    for (const line of lines) {
                        if (!line.startsWith('data: ')) continue;
                        const data = line.slice(6).trim();
                        if (data === '[DONE]') continue;

                        try {
                            const event = JSON.parse(data);
                            handleStreamEvent(event, assistantDiv, textParts, toolsUsed);
                        } catch {}
                    }
                }
            } catch (err) {
                addMessage(`Error de conexion: ${err.message}`, 'error');
            }

            setTyping(false);
            sendBtn.disabled = false;
            msgInput.focus();
        }

        function handleStreamEvent(event, div, textParts, toolsUsed) {
            if (event.type === 'system' && event.subtype === 'init') {
                currentSessionId = event.session_id;
            }

            if (event.type === 'assistant') {
                const content = event.message?.content || [];
                for (const block of content) {
                    if (block.type === 'text') {
                        textParts.push(block.text);
                        renderAssistant(div, textParts, toolsUsed);
                        setTyping(true, 'Escribiendo');
                    } else if (block.type === 'tool_use') {
                        const toolLabel = getToolLabel(block.name, block.input);
                        toolsUsed.push(toolLabel);
                        renderAssistant(div, textParts, toolsUsed);
                        setTyping(true, toolLabel);
                    }
                }
            } else if (event.type === 'result') {
                if (event.session_id) {
                    currentSessionId = event.session_id;
                }
                if (event.result && textParts.length === 0) {
                    textParts.push(event.result);
                    renderAssistant(div, textParts, toolsUsed);
                }
                setTyping(false);
            } else if (event.type === 'error') {
                div.className = 'message error';
                div.textContent = event.error || 'Error desconocido';
                setTyping(false);
            }

            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function renderAssistant(div, textParts, toolsUsed) {
            let html = '';

            if (toolsUsed.length > 0) {
                html += '<div class="tools-used">';
                for (const tool of toolsUsed) {
                    html += `<span class="tool-badge">${escapeHtml(tool)}</span>`;
                }
                html += '</div>';
            }

            html += escapeHtml(textParts.join(''));
            div.innerHTML = html;
        }

        function getToolLabel(name, input) {
            const labels = {
                'Read': 'Leyendo archivo',
                'Bash': 'Ejecutando comando',
                'Grep': 'Buscando en codigo',
                'Glob': 'Buscando archivos',
                'Write': 'Escribiendo archivo',
                'Edit': 'Editando archivo',
            };
            let label = labels[name] || name;
            if (name === 'Read' && input?.file_path) {
                const short = input.file_path.split(/[/\\]/).pop();
                label += `: ${short}`;
            }
            if (name === 'Bash' && input?.description) {
                label = input.description;
            }
            return label;
        }

        function escapeHtml(text) {
            const d = document.createElement('div');
            d.textContent = text;
            return d.innerHTML;
        }

        function logout() {
            localStorage.clear();
            window.location.href = '/login';
        }
    </script>
</body>
</html>
