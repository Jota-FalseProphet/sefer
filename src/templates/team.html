<!DOCTYPE html>
<html lang="es">
<script>if(localStorage.getItem('sefer_theme')==='light')document.documentElement.setAttribute('data-theme','light')</script>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sefer - Equipo</title>
    <link rel="stylesheet" href="/static/style.css?v=3">
</head>
<body>
    <div class="header">
        <div class="header-left">
            <h1>Sefer</h1>
            <nav class="nav">
                <a href="/">Chat</a>
                <a href="/specs">Specs</a>
                <a href="/team" class="active">Equipo</a>
            </nav>
        </div>
        <div class="user-menu-wrapper">
            <button class="user-menu-btn" id="user-menu-btn">
                <span class="user-avatar" id="user-avatar"></span>
                <svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><path d="M2.5 4.5L6 8l3.5-3.5"/></svg>
            </button>
            <div class="user-menu" id="user-menu">
                <div class="user-menu-header">
                    <div class="user-menu-email" id="user-menu-email"></div>
                </div>
                <div class="user-menu-divider"></div>
                <button class="user-menu-item" id="theme-toggle">
                    <span id="theme-icon">&#9789;</span>
                    <span id="theme-label">Tema claro</span>
                </button>
                <div class="user-menu-divider"></div>
                <button class="user-menu-item user-menu-logout" onclick="logout()">
                    Cerrar sesion
                </button>
            </div>
        </div>
    </div>

    <div class="page-content">
    <div class="team-container">
        <div class="team-header">
            <h2>Desarrolladores</h2>
            <button onclick="showAddModal()" style="padding:8px 16px;background:var(--accent-dim);color:#1a1a1a;border:none;border-radius:6px;font-size:0.85rem;cursor:pointer;font-weight:600;">+ Añadir dev</button>
        </div>
        <div class="dev-grid" id="dev-grid"></div>
    </div>

    </div><!-- .page-content -->

    <!-- Add/Edit modal -->
    <div class="modal-overlay" id="dev-modal" style="display:none;">
        <div class="modal">
            <h2 id="modal-title">Añadir desarrollador</h2>
            <input type="hidden" id="dev-id">
            <input type="text" id="dev-name" placeholder="Nombre">
            <input type="email" id="dev-email" placeholder="Email">
            <textarea id="dev-skills" placeholder="Habilidades (ej: Python, Odoo, frontend React...)"></textarea>
            <textarea id="dev-notes" placeholder="Notas (ej: horarios, disponibilidad, preferencias...)"></textarea>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
                <button class="btn-confirm" onclick="saveDev()">Guardar</button>
            </div>
        </div>
    </div>

    <script src="/static/chat-widget.js?v=3"></script>
    <script>
        const TOKEN = localStorage.getItem('sefer_token');
        const EMAIL = localStorage.getItem('sefer_email');
        if (!TOKEN) window.location.href = '/login';

        // User menu
        document.getElementById('user-menu-email').textContent = EMAIL || '';
        document.getElementById('user-avatar').textContent = EMAIL ? EMAIL[0].toUpperCase() : '?';
        const menuBtn = document.getElementById('user-menu-btn');
        const menu = document.getElementById('user-menu');
        menuBtn.addEventListener('click', (e) => { e.stopPropagation(); menu.classList.toggle('open'); });
        document.addEventListener('click', () => menu.classList.remove('open'));
        menu.addEventListener('click', (e) => e.stopPropagation());

        // Theme
        (function initTheme() {
            const t = localStorage.getItem('sefer_theme') || 'dark';
            if (t === 'light') { document.getElementById('theme-icon').textContent = '\u2600'; document.getElementById('theme-label').textContent = 'Tema oscuro'; }
        })();
        document.getElementById('theme-toggle').addEventListener('click', () => {
            const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
            if (next === 'light') { document.documentElement.setAttribute('data-theme', 'light'); document.getElementById('theme-icon').textContent = '\u2600'; document.getElementById('theme-label').textContent = 'Tema oscuro'; }
            else { document.documentElement.removeAttribute('data-theme'); document.getElementById('theme-icon').textContent = '\u263D'; document.getElementById('theme-label').textContent = 'Tema claro'; }
            localStorage.setItem('sefer_theme', next);
        });

        const headers = { 'Authorization': `Bearer ${TOKEN}` };

        async function loadDevs() {
            const res = await fetch('/api/developers', { headers });
            if (res.status === 401) { localStorage.clear(); window.location.href = '/login'; return; }
            const devs = await res.json();
            const grid = document.getElementById('dev-grid');
            grid.innerHTML = devs.map(d => `
                <div class="dev-card">
                    <h3>${escapeHtml(d.name)}</h3>
                    <div class="dev-email">${escapeHtml(d.email || '')}</div>
                    ${d.skills ? `<div class="dev-skills">${escapeHtml(d.skills)}</div>` : ''}
                    ${d.notes ? `<div style="font-size:0.8rem;color:var(--text-muted);margin-top:4px;">${escapeHtml(d.notes)}</div>` : ''}
                    <div class="dev-actions">
                        <button onclick="editDev(${d.id}, '${escapeAttr(d.name)}', '${escapeAttr(d.email||'')}', '${escapeAttr(d.skills||'')}', '${escapeAttr(d.notes||'')}')">Editar</button>
                        <button onclick="deleteDev(${d.id})">Eliminar</button>
                    </div>
                </div>
            `).join('');
            if (devs.length === 0) {
                grid.innerHTML = '<p style="color:var(--text-muted);grid-column:1/-1;">No hay desarrolladores. Añade uno para empezar.</p>';
            }
        }

        function showAddModal() {
            document.getElementById('modal-title').textContent = 'Añadir desarrollador';
            document.getElementById('dev-id').value = '';
            document.getElementById('dev-name').value = '';
            document.getElementById('dev-email').value = '';
            document.getElementById('dev-skills').value = '';
            document.getElementById('dev-notes').value = '';
            document.getElementById('dev-modal').style.display = 'flex';
            document.getElementById('dev-name').focus();
        }

        function editDev(id, name, email, skills, notes) {
            document.getElementById('modal-title').textContent = 'Editar desarrollador';
            document.getElementById('dev-id').value = id;
            document.getElementById('dev-name').value = name;
            document.getElementById('dev-email').value = email;
            document.getElementById('dev-skills').value = skills;
            document.getElementById('dev-notes').value = notes;
            document.getElementById('dev-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('dev-modal').style.display = 'none';
        }

        async function saveDev() {
            const id = document.getElementById('dev-id').value;
            const body = {
                name: document.getElementById('dev-name').value.trim(),
                email: document.getElementById('dev-email').value.trim() || null,
                skills: document.getElementById('dev-skills').value.trim() || null,
                notes: document.getElementById('dev-notes').value.trim() || null,
            };
            if (!body.name) return;

            if (id) {
                await fetch(`/api/developers/${id}`, {
                    method: 'PUT',
                    headers: { ...headers, 'Content-Type': 'application/json' },
                    body: JSON.stringify(body),
                });
            } else {
                await fetch('/api/developers', {
                    method: 'POST',
                    headers: { ...headers, 'Content-Type': 'application/json' },
                    body: JSON.stringify(body),
                });
            }
            closeModal();
            loadDevs();
        }

        async function deleteDev(id) {
            if (!confirm('Eliminar este desarrollador?')) return;
            await fetch(`/api/developers/${id}`, { method: 'DELETE', headers });
            loadDevs();
        }

        function escapeHtml(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
        function escapeAttr(t) { return (t || '').replace(/'/g, "\\'").replace(/\n/g, ' '); }
        function logout() { localStorage.clear(); window.location.href = '/login'; }

        loadDevs();
    </script>
</body>
</html>
