services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odoo}
      POSTGRES_DB: odoo
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./docker/db:/docker-entrypoint-initdb.d:ro

  odoo:
    build: ./EpistolaGenesis
    restart: unless-stopped
    depends_on:
      - db
    volumes:
      - odoo-data:/var/lib/odoo
    environment:
      - HOST=db

  sefer:
    build: .
    restart: unless-stopped
    environment:
      SEFER_CLAUDE_CWD: /app/EpistolaGenesis
      SEFER_MODEL: ${SEFER_MODEL:-sonnet}
      RESEND_API_KEY: ${RESEND_API_KEY}
      DATABASE_URL: postgresql://sefer:sefer@db:5432/sefer
    depends_on:
      - db
    volumes:
      - ./EpistolaGenesis:/app/EpistolaGenesis:ro
      - ./data:/app/data

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - sefer

volumes:
  pg-data:
  odoo-data:
  sefer-data:
